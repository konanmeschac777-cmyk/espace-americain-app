# SQLite. Versions 3.8.0 and up are supported.
#   gem install sqlite3
#
#   Ensure the SQLite 3 gem is defined in your Gemfile
#   gem "sqlite3"
#
default: &default
  adapter: sqlite3
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  <<: *default
  database: storage/development.sqlite3

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: storage/test.sqlite3

# SQLite3 write its data on the local filesystem, as such it requires
# persistent disks. If you are deploying to a managed service, you should
# make sure it provides disk persistence, as many don't.
#
# Similarly, if you deploy your application as a Docker container, you must
# ensure the database is located in a persisted volume.
# Serveur local de l'Espace. Les quatre fichiers vivent dans le même dossier,
# celui que la sauvegarde nocturne recopie sur la clé USB. DATABASE_DIR permet
# de les déplacer sur un disque monté sans toucher à ce fichier ; c'est ce que
# fait le volume Docker décrit dans deploy/README.md.
#
# Seule "primary" contient le fonds, les abonnés et les prêts. Les trois
# autres sont des bases techniques de Rails, reconstructibles : en cas de
# restauration, c'est primary qui compte.
production:
  primary:
    <<: *default
    database: <%= ENV.fetch("DATABASE_DIR", "storage") %>/production.sqlite3
  cache:
    <<: *default
    database: <%= ENV.fetch("DATABASE_DIR", "storage") %>/production_cache.sqlite3
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: <%= ENV.fetch("DATABASE_DIR", "storage") %>/production_queue.sqlite3
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: <%= ENV.fetch("DATABASE_DIR", "storage") %>/production_cable.sqlite3
    migrations_paths: db/cable_migrate
