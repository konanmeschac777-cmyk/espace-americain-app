<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Libre+Franklin:wght@700;800&family=Public+Sans:wght@400;600;700&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Public Sans', system-ui, sans-serif; font-size: 16px; color: #3D4752; background: #F7F8FA; }
    a { color: #0A2240; } a:hover { color: #143A6B; }
    input::placeholder { color: #8A939C; }
  </style>
</helmet>

<div style="width: 390px; min-height: 640px; background: #F7F8FA; display: flex; flex-direction: column;">

  <header style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 10px 16px; background: #0A2240;">
    <div style="flex: 1; min-width: 0;">
      <p style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(255,255,255,0.6); margin: 0;">American Shelf de Tiassalé</p>
      <h1 style="font-family: 'Libre Franklin', sans-serif; font-size: 18px; font-weight: 700; color: #FFFFFF; margin: 0;">Enregistrer un prêt</h1>
    </div>
    <a href="#" style="flex-shrink: 0; font-size: 14px; font-weight: 600; color: rgba(255,255,255,0.8); text-decoration: underline;">Quitter</a>
  </header>

  <div style="padding: 16px;">

    <ol style="display: flex; gap: 8px; margin: 0 0 20px; padding: 0; list-style: none;">
      <li style="flex: 1; display: flex; align-items: center; gap: 8px;">
        <span style="display: flex; width: 28px; height: 28px; flex-shrink: 0; align-items: center; justify-content: center; border-radius: 999px; background: #0A2240; color: #FFFFFF; font-family: 'Public Sans', sans-serif; font-size: 14px; font-weight: 700;">1</span>
        <span style="font-size: 14px; color: #1B1B1B; font-weight: 700;">Abonné</span>
      </li>
      <li style="flex: 1; display: flex; align-items: center; gap: 8px;">
        <span style="display: flex; width: 28px; height: 28px; flex-shrink: 0; align-items: center; justify-content: center; border-radius: 999px; background: #F1F4F8; border: 1px solid #C9CFD6; color: #8A939C; font-family: 'Public Sans', sans-serif; font-size: 14px; font-weight: 700;">2</span>
        <span style="font-size: 14px; color: #8A939C;">Ouvrage</span>
      </li>
      <li style="flex: 1; display: flex; align-items: center; gap: 8px;">
        <span style="display: flex; width: 28px; height: 28px; flex-shrink: 0; align-items: center; justify-content: center; border-radius: 999px; background: #F1F4F8; border: 1px solid #C9CFD6; color: #8A939C; font-family: 'Public Sans', sans-serif; font-size: 14px; font-weight: 700;">3</span>
        <span style="font-size: 14px; color: #8A939C;">Confirmer</span>
      </li>
    </ol>

    <h2 style="font-family: 'Libre Franklin', sans-serif; font-size: 18px; font-weight: 700; color: #1B1B1B; margin: 0 0 12px;">Qui emprunte ?</h2>

    <label style="display: block; margin-bottom: 6px; font-family: 'Libre Franklin', sans-serif; font-size: 15px; font-weight: 700; color: #1B1B1B;" for="q">Nom ou numéro de carte</label>
    <div style="display: flex; gap: 8px; margin-bottom: 16px;">
      <input id="q" type="search" placeholder="Koné, ou TSL-2026-0087" style="flex: 1; min-width: 0; min-height: 48px; padding: 12px 14px; background: #FFFFFF; border: 1px solid #C9CFD6; border-radius: 4px; font-family: 'Public Sans', sans-serif; font-size: 16px; color: #1B1B1B;">
      <button type="button" style="display: inline-flex; flex-shrink: 0; align-items: center; justify-content: center; min-height: 48px; padding: 12px 20px; border: none; border-radius: 4px; background: #0A2240; color: #FFFFFF; font-family: 'Libre Franklin', sans-serif; font-size: 16px; font-weight: 700; cursor: pointer;">Chercher</button>
    </div>

    <div style="padding: 40px 24px; text-align: center; background: #FFFFFF; border: 1px dashed #C9CFD6; border-radius: 6px;">
      <p style="font-family: 'Libre Franklin', sans-serif; font-size: 18px; font-weight: 700; color: #1B1B1B; margin: 0;">Commence par chercher l'abonné</p>
      <p style="font-size: 15px; line-height: 1.5; color: #5C6670; margin: 8px 0 0;">Tape les premières lettres de son nom, ou scanne le numéro de sa carte.</p>
    </div>

  </div>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
